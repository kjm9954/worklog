<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkLog Notion 연결</title>
  <script>
    (function(){
      var allowedTargets = {
        'public-worklog.html': true,
        'public-weekly.html': true,
        'public-calendar.html': true,
        'public-routine.html': true,
        'public-memo.html': true,
        'public-review.html': true,
        'public-history.html': true,
        'public-distribution.html': true,
        'public-deadline.html': true,
        'public-summary.html': true,
        'public-board.html': true,
        'public-daily.html': true,
        'notion-retro-check.html': true,
        'notion-retro-record.html': true,
        'notion-retro-history.html': true,
        'notion-retro-detail-history.html': true
      };
      var placeholder = /^(WORKLOG_INSTANCE_ID|__WORKLOG_INSTANCE_ID__|WORKLOG_WIDGET_INSTANCE_ID|__WORKLOG_WIDGET_INSTANCE_ID__|INSTANCE_ID|template|TEMPLATE)$/;
      var instance = /^[A-Za-z0-9_-]{24,180}$/;
      try {
        var params = new URLSearchParams(window.location.search || '');
        var w = params.get('w') || params.get('instance') || '';
        var from = params.get('from') || 'public-worklog.html';
        if (allowedTargets[from] && instance.test(w) && !placeholder.test(w)) {
          var next = new URL(from, window.location.href);
          params.forEach(function(value, key){
            if (key !== 'from') next.searchParams.set(key, value);
          });
          if (/^notion-retro-/.test(from)) next.searchParams.set('rv', '20260726-retro-fix');
          window.location.replace(next.toString() + (window.location.hash || ''));
        }
      } catch (e) {}
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #f6f6f4;
      --card: #fff;
      --text: #37352f;
      --muted: #787774;
      --border: #e8e8e5;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
      --accent: #2f6fed;
      --accent-dark: #1f55bd;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
    }
    .card {
      width: min(100%, 420px);
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 20px;
      line-height: 1.3;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }
    a:hover { background: var(--accent-dark); }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #9b9a97;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Notion 연결이 필요해요</h1>
    <p>이 위젯은 공개 템플릿용 주소라 아직 개인 데이터 저장소가 연결되지 않았어요. 처음 한 번만 Notion으로 연결하면 이후에는 자동으로 같은 데이터를 불러옵니다.</p>
    <a id="startLink" href="https://worklog-public.wldnjsdkk.workers.dev/auth/notion/start" target="_blank" rel="noopener">Notion 연결하기</a>
    <div class="hint">연결 후 템플릿 안의 임베드 주소가 자동으로 개인용 주소로 바뀝니다.</div>
  </main>
  <script>
    (function(){
      var link = document.getElementById('startLink');
      if (!link) return;
      try {
        var url = new URL(link.href);
        url.searchParams.set('return_to', window.location.href);
        link.href = url.toString();
      } catch (e) {}
    })();
  </script>
</body>
</html>
