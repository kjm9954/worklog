        <button class="btn sm" onclick="openRestoreMenu(render)" title="JSON 복원"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg> 복원</button>

<script>window.WORKLOG_KEY_PREFIX = "worklog-pub";</script>
<script src="instance-sync.js?v=5"></script>
<script src="shared.js?v=7"></script>
<script>
  'use strict';

  const STATUS_PREFIX = s => '● ' + s;
  let boardOpenPopover = null;
  let pageTabsOpen = false;
  const datePicker = {
    el: null,
    currentInput: null,
    currentMonth: null
  };
  const BOARD_CAL_STORAGE_KEY = 'worklog-board-cal-anchor';
  const BOARD_WEEKDAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];
  let boardMonthAnchor = loadBoardMonthAnchor();
  let boardSelectedDate = formatDate(new Date());
  let boardTodayPulse = false;
  let boardDayClickTimer = null;

  function loadBoardMonthAnchor() {
    try {
      const raw = sessionStorage.getItem(BOARD_CAL_STORAGE_KEY) || '';
      const match = raw.match(/^(\d{4})-(\d{2})$/);
      if (match) return new Date(Number(match[1]), Number(match[2]) - 1, 1);
    } catch (e) {}
    const today = new Date();
    return new Date(today.getFullYear(), today.getMonth(), 1);
  }

  function saveBoardMonthAnchor() {
    try {
      sessionStorage.setItem(BOARD_CAL_STORAGE_KEY, `${boardMonthAnchor.getFullYear()}-${String(boardMonthAnchor.getMonth() + 1).padStart(2, '0')}`);
    } catch (e) {}
  }

  function boardDateObj(dateStr) {
    if (!dateStr) return null;
    const parts = String(dateStr).split('-').map(Number);
    if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function boardDateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function setBoardMonthAnchor(date, keepSelection) {
    const next = new Date(date.getFullYear(), date.getMonth(), 1);
    boardMonthAnchor = next;
    saveBoardMonthAnchor();
    if (!keepSelection || !boardSelectedDate || !boardIsSameMonth(boardSelectedDate, next)) {
      boardSelectedDate = boardDateKey(new Date(next.getFullYear(), next.getMonth(), 1));
    }
  }

  function boardIsSameMonth(dateStr, anchor) {
    const date = boardDateObj(dateStr);
    if (!date) return false;
    return date.getFullYear() === anchor.getFullYear() && date.getMonth() === anchor.getMonth();
  }

  function ensureBoardSelectedDate() {
    if (!boardSelectedDate || !boardIsSameMonth(boardSelectedDate, boardMonthAnchor)) {
      const today = formatDate(new Date());
      if (boardIsSameMonth(today, boardMonthAnchor)) boardSelectedDate = today;
      else boardSelectedDate = boardDateKey(new Date(boardMonthAnchor.getFullYear(), boardMonthAnchor.getMonth(), 1));
    }
  }

  function importantTasksForDate(dateStr) {
    return (state.importantTasks || []).filter(item => item.targetDate === dateStr);
  }

  function importantUndatedTasks() {
    return (state.importantTasks || []).filter(item => !item.targetDate);
  }

  function boardCategoryTone(category) {
    const key = (category || '').trim();
    if (['에셋', '아트'].includes(key)) return 'cat-asset';
    if (['빌드', '테이블', '운영'].includes(key)) return 'cat-build';
    if (['스터디', 'QA'].includes(key)) return 'cat-study';
    return '';
  }

  function boardTaskLabel(task) {
    return (task && task.name && String(task.name).trim()) || '(이름 없음)';
  }

  function boardDateLabel(dateStr) {
    const date = boardDateObj(dateStr);
    if (!date) return '날짜 미지정';
    return `${date.getMonth() + 1}월 ${date.getDate()}일`;
  }

  function syncPageTabs() {
    const nav = document.getElementById('pageTabs');
    const btn = document.getElementById('pageTabsToggleBtn');
    if (!nav || !btn) return;
    nav.hidden = !pageTabsOpen;
    btn.setAttribute('aria-expanded', pageTabsOpen ? 'true' : 'false');
    btn.textContent = pageTabsOpen ? '탭 숨기기' : '탭 펼치기';
  }

  window.togglePageTabs = function() {
    pageTabsOpen = !pageTabsOpen;
    syncPageTabs();
  };

  function buildSelect(cls, value, options, onchange, formatter) {
    const fmt = typeof formatter === 'function' ? formatter : (o => o);
    const opts = options.map(o => `<option value="${escapeHtml(o)}"${o === value ? ' selected' : ''}>${escapeHtml(fmt(o))}</option>`).join('');
    return `<select class="${cls}" data-v="${escapeHtml(value)}" onchange="${onchange}; this.dataset.v=this.value;">${opts}</select>`;
  }

  function buildCatInput(cls, value, suggestions, onchange, placeholder) {
    const listId = 'dl_' + Math.random().toString(36).slice(2, 8);
    const opts = (suggestions || []).map(o => `<option value="${escapeHtml(o)}">`).join('');
    const ph = placeholder || '구분';
    return `<input type="text" class="${cls}" list="${listId}" placeholder="${escapeHtml(ph)}" value="${escapeHtml(value || '')}" data-v="${escapeHtml(value || '')}" onchange="${onchange}; this.dataset.v=this.value;"><datalist id="${listId}">${opts}</datalist>`;
  }

  function getCategorySuggestions(kind) {
    const set = new Set();
    if (kind === 'important') {
      (state.importantTasks || []).forEach(t => { if (t.category) set.add(t.category); });
    } else if (kind === 'routineCat') {
      (state.routines || []).forEach(t => { if (t.category) set.add(t.category); });
    } else if (kind === 'routineSub') {
      (state.routines || []).forEach(t => { if (t.subCategory) set.add(t.subCategory); });
    }
    return Array.from(set).sort();
  }

  function getBoardItem(kind, idx) {
    const list = kind === 'important' ? state.importantTasks : state.routines;
    return list && list[idx] ? list[idx] : null;
  }

  function boardStatusKey(status) {
    if (status === '완료') return 'done';
    if (status === '진행중') return 'doing';
    return 'wait';
  }

  function boardStatusLabel(key) {
    if (key === 'done') return '완료';
    if (key === 'doing') return '진행중';
    return '대기';
  }

  function boardStatusValue(key) {
    if (key === 'done') return '완료';
    if (key === 'doing') return '진행중';
    return '대기';
  }

  function buildProjectSelect(value, onchange) {
    const labels = (state && state.projectLabels) || DEFAULT_PROJECTS;
    const slot = projectSlot(value);
    const opts = labels.map(o => `<option value="${escapeHtml(o)}"${o === value ? ' selected' : ''}>${escapeHtml(o)}</option>`).join('');
    return `<select class="project-tag" data-v="${escapeHtml(value)}" data-slot="${slot}" onchange="${onchange}; this.dataset.v=this.value;">${opts}</select>`;
  }

  function fridayOfWeek(weekStart) {
    if (!weekStart) return '';
    const parts = String(weekStart).split('-').map(Number);
    if (parts.length < 3 || parts.some(n => isNaN(n))) return '';
    const base = new Date(parts[0], parts[1] - 1, parts[2]);
    base.setDate(base.getDate() + 4);
    return formatDate(base);
  }

  function positionPopoverBelow(anchor, popEl, opts) {
    const rect = anchor.getBoundingClientRect();
    const centered = opts && opts.centered;
    popEl.style.top = (rect.bottom + 4) + 'px';
    if (centered) {
      requestAnimationFrame(() => {
        const pr = popEl.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        let left = cx - pr.width / 2;
        if (left < 8) left = 8;
        else if (left + pr.width > window.innerWidth - 8) left = window.innerWidth - pr.width - 8;
        popEl.style.left = left + 'px';
      });
    } else {
      popEl.style.left = rect.left + 'px';
    }
    requestAnimationFrame(() => {
      const pr = popEl.getBoundingClientRect();
      if (!centered && pr.right > window.innerWidth - 8) {
        popEl.style.left = Math.max(8, window.innerWidth - pr.width - 8) + 'px';
      }
      if (pr.bottom > window.innerHeight - 8) {
        popEl.style.top = Math.max(8, rect.top - pr.height - 4) + 'px';
      }
    });
  }

  function boardPopoverOutsideClick(e) {
    if (!boardOpenPopover) return;
    const pop = boardOpenPopover.el;
    if (pop && pop.contains(e.target)) return;
    closeBoardPopover();
  }

  function closeBoardPopover(opts) {
    if (!boardOpenPopover) return;
    const immediate = opts === true || (opts && opts.immediate);
    const closeMeta = boardOpenPopover;
    if (typeof closeMeta.onClose === 'function') {
      try { closeMeta.onClose(); } catch (e) {}
    }
    const el = boardOpenPopover.el;
    boardOpenPopover = null;
    document.removeEventListener('click', boardPopoverOutsideClick);
    window.removeEventListener('scroll', boardPopoverScrollHandler, true);
    window.removeEventListener('resize', boardPopoverResizeHandler);
    if (!el) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (immediate || reduce) {
      if (el.parentNode) el.parentNode.removeChild(el);
      return;
    }
    el.classList.add('is-closing');
    el.classList.remove('is-open');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 180);
  }
  window.closeBoardPopover = closeBoardPopover;
  function boardPopoverResizeHandler() { closeBoardPopover(true); }

  function boardPopoverScrollHandler(e) {
    if (!boardOpenPopover) return;
    if (boardOpenPopover.keepOpenOnScroll) return;
    const pop = boardOpenPopover.el;
    if (pop && e && e.target && pop.contains(e.target)) return;
    closeBoardPopover();
  }

  function attachBoardPopoverGlobalListeners() {
    const el = boardOpenPopover && boardOpenPopover.el;
    // reflow 후 클래스 추가 — rAF가 throttle되는 임베드에서도 페이드인 보장
    if (el) { void el.offsetWidth; el.classList.add('is-open'); }
    setTimeout(() => {
      document.addEventListener('click', boardPopoverOutsideClick);
      window.addEventListener('scroll', boardPopoverScrollHandler, true);
      window.addEventListener('resize', boardPopoverResizeHandler);
    }, 0);
  }

  function removeProjectLabel(name) {
    const labels = state.projectLabels || [];
    const idx = labels.indexOf(name);
    if (idx >= 0) {
      labels.splice(idx, 1);
      saveState();
    }
  }

  function startAddProjectLabel(pop, rebuild, anchorEl) {
    const addRow = pop.querySelector('.daily-pop-row.add-row');
    if (!addRow) return;
    addRow.innerHTML = '<input class="daily-pop-input" type="text" maxlength="20" placeholder="새 구분 이름">';
    const input = addRow.querySelector('input');
    input.focus();
    let done = false;
    function commit(save) {
      if (done) return;
      done = true;
      if (!pop.isConnected) return;
      if (save) {
        const value = (input.value || '').trim();
        if (value) {
          state.projectLabels = state.projectLabels || [];
          if (!state.projectLabels.includes(value)) state.projectLabels.push(value);
          saveState();
        }
      }
      rebuild();
      positionPopoverBelow(anchorEl, pop);
    }
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); commit(true); }
      else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
    });
    input.addEventListener('blur', () => commit(true));
  }

  function startRenameProjectLabel(pop, oldName, rebuild, anchorEl) {
    const row = Array.from(pop.querySelectorAll('.daily-pop-row')).find(el => {
      const pickBtn = el.querySelector('.daily-pop-item[data-act="pick"]');
      return pickBtn && pickBtn.dataset.label === oldName;
    });
    if (!row) return;
    row.innerHTML = `<span class="daily-pop-check">✎</span><input class="daily-pop-input" type="text" maxlength="20" value="${escapeHtml(oldName)}">`;
    const input = row.querySelector('input');
    input.focus();
    input.select();
    let done = false;
    function commit(save) {
      if (done) return;
      done = true;
      if (!pop.isConnected) return;
      if (save) {
        const value = (input.value || '').trim();
        if (value && value !== oldName) {
          const labels = state.projectLabels || [];
          const idx = labels.indexOf(oldName);
          if (idx >= 0 && !labels.includes(value)) labels[idx] = value;
          saveState();
        }
      }
      rebuild();
      positionPopoverBelow(anchorEl, pop);
    }
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); commit(true); }
      else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
    });
    input.addEventListener('blur', () => commit(true));
  }

  function setBoardStatus(kind, idx, next) {
    const item = getBoardItem(kind, idx);
    if (!item) return;
    if (!['wait', 'doing', 'done'].includes(next)) return;
    item.status = boardStatusValue(next);
    saveState();
    render();
  }

  window.openBoardStatusPopover = function(kind, idx, anchorEl) {
    closeBoardPopover(true);
    const item = getBoardItem(kind, idx);
    if (!item || !anchorEl) return;
    const current = boardStatusKey(item.status);
    const options = [
      { key: 'wait', label: '대기' },
      { key: 'doing', label: '진행중' },
      { key: 'done', label: '완료' }
    ];
    const pop = document.createElement('div');
    pop.className = 'daily-popover status-popover';
    pop.innerHTML = options.map(option => `
      <button class="daily-pop-item ${option.key === current ? 'active' : ''}" data-status="${option.key}">
        <span class="daily-pop-check">${option.key === current ? '✓' : ''}</span>
        <span class="daily-status ${option.key}">${option.label}</span>
      </button>
    `).join('');
    document.body.appendChild(pop);
    positionPopoverBelow(anchorEl, pop);
    pop.addEventListener('click', e => {
      const btn = e.target.closest('.daily-pop-item');
      if (!btn) return;
      e.stopPropagation();
      closeBoardPopover();
      setBoardStatus(kind, idx, btn.dataset.status);
    });
    boardOpenPopover = { type: 'status', kind: kind, idx: idx, el: pop };
    attachBoardPopoverGlobalListeners();
  };

  window.openBoardProjectPopover = function(kind, idx, anchorEl) {
    closeBoardPopover(true);
    const item = getBoardItem(kind, idx);
    if (!item || !anchorEl) return;

    const pop = document.createElement('div');
    pop.className = 'daily-popover project-popover';
    document.body.appendChild(pop);

    function rebuild() {
      const labels = (state.projectLabels || []).slice();
      const current = item.project || '';
      const isOrphan = current && !labels.includes(current);
      if (isOrphan) labels.push(current);

      const rows = labels.map(label => {
        const slot = projectSlot(label);
        const orphan = label === current && isOrphan;
        const actions = orphan ? '' : `
          <button class="daily-pop-mini" data-act="edit" data-label="${escapeHtml(label)}" title="이름 수정">✎</button>
          <button class="daily-pop-mini" data-act="del" data-label="${escapeHtml(label)}" title="삭제">×</button>
        `;
        return `
          <div class="daily-pop-row ${label === current ? 'active' : ''}">
            <button class="daily-pop-item" data-act="pick" data-label="${escapeHtml(label)}">
              <span class="daily-pop-check">${label === current ? '✓' : ''}</span>
              <span class="daily-chip" data-slot="${slot}">${escapeHtml(label)}${orphan ? ' <em class="daily-pop-orphan">(삭제됨)</em>' : ''}</span>
            </button>
            ${actions}
          </div>
        `;
      }).join('');

      const addRow = `
        <div class="daily-pop-row add-row">
          <button class="daily-pop-item daily-pop-add" data-act="add-open">
            <span class="daily-pop-check">+</span>
            <span class="daily-pop-add-label">새 구분 추가</span>
          </button>
        </div>
      `;
      pop.innerHTML = `<div class="daily-pop-list">${rows}${addRow}</div>`;
    }

    rebuild();
    positionPopoverBelow(anchorEl, pop);

    pop.addEventListener('click', e => {
      const miniBtn = e.target.closest('.daily-pop-mini');
      if (miniBtn) {
        e.stopPropagation();
        const label = miniBtn.dataset.label;
        if (miniBtn.dataset.act === 'del') {
          removeProjectLabel(label);
          rebuild();
          positionPopoverBelow(anchorEl, pop);
        } else if (miniBtn.dataset.act === 'edit') {
          startRenameProjectLabel(pop, label, rebuild, anchorEl);
        }
        return;
      }
      const pickBtn = e.target.closest('.daily-pop-item[data-act="pick"]');
      if (pickBtn) {
        e.stopPropagation();
        item.project = pickBtn.dataset.label;
        saveState();
        closeBoardPopover();
        render();
        return;
      }
      const addBtn = e.target.closest('.daily-pop-item[data-act="add-open"]');
      if (addBtn) {
        e.stopPropagation();
        startAddProjectLabel(pop, rebuild, anchorEl);
      }
    });

    boardOpenPopover = { type: 'project', kind: kind, idx: idx, el: pop };
    attachBoardPopoverGlobalListeners();
  };

  function statCardHtml(label, value, tone) {
    return `
      <article class="board-stat ${tone ? 'is-' + tone : ''}">
        <div class="board-stat-label">${escapeHtml(label)}</div>
        <div class="board-stat-value">${escapeHtml(String(value))}</div>
      </article>`;
  }

  function renderBoardSummary() {
    const container = document.getElementById('boardStats');
    if (!container) return;
    const important = state.importantTasks || [];
    const routines = state.routines || [];
    const all = important.concat(routines);
    const active = all.filter(item => item.status !== '완료');
    const dueSoon = active.filter(item => {
      const diff = calcDDay(item.targetDate);
      return diff != null && diff >= 0 && diff <= 7;
    }).length;
    const completed = all.filter(item => item.status === '완료').length;

    container.innerHTML = [
      statCardHtml('중요 업무', important.length, 'important'),
      statCardHtml('상시 업무', routines.length, 'routine'),
      statCardHtml('7일 이내 마감', dueSoon, 'soon'),
      statCardHtml('완료 항목', completed, 'done')
    ].join('');
  }

  function importantTaskOptionsHtml(current) {
    const labels = (state.projectLabels || []).slice();
    if (current && !labels.includes(current)) labels.push(current);
    const options = ['<option value="">-</option>'].concat(labels.map(label => `<option value="${escapeHtml(label)}"${label === current ? ' selected' : ''}>${escapeHtml(label)}</option>`));
    return options.join('');
  }

  function openImportantEditorAfterRender(idx) {
    setTimeout(() => {
      let anchor = document.querySelector(`[data-imp-anchor="${idx}"]`);
      // 모바일 원형 달력에서는 칩이 숨겨져 있어 (0×0) 앵커로 못 씀 → 날짜 셀로 폴백
      if (anchor && !anchor.getBoundingClientRect().width) anchor = null;
      anchor = anchor || document.querySelector(`[data-cal-date="${boardSelectedDate}"]`) || document.getElementById('importantList');
      if (anchor) openImportantEditor(idx, anchor);
    }, 0);
  }

  function createImportantTask(targetDate) {
    const labels = (state.projectLabels && state.projectLabels.length) ? state.projectLabels : DEFAULT_PROJECTS;
    const item = {
      id: uid(),
      project: labels[0] || '',
      category: '',
      name: '',
      status: '대기',
      targetDate: targetDate || '',
      note: ''
    };
    state.importantTasks.push(item);
    return state.importantTasks.length - 1;
  }

  function renderImportantCardList(items, emptyText) {
    if (!items.length) return `<div class="board-day-empty">${escapeHtml(emptyText)}</div>`;
    return items.map(it => {
      const idx = state.importantTasks.indexOf(it);
      const slot = projectSlot(it.project) || '';
      const statusKey = boardStatusKey(it.status);
      return `
        <div class="board-undated-card ${it.status === '완료' ? 'done' : ''}"
             data-slot="${slot}"
             draggable="true"
             ondragstart="onImportantDragStart(event, ${idx})"
             ondragend="onImportantDragEnd(event)">
          <div class="board-day-card-title">
            <span class="board-day-card-title-text">${escapeHtml(boardTaskLabel(it))}</span>
            <button type="button" class="btn sm" data-imp-anchor="${idx}" onclick="openImportantEditor(${idx}, this)">편집</button>
          </div>
          <div class="board-day-card-meta">
            ${it.project ? `<span class="daily-chip" data-slot="${slot}">${escapeHtml(it.project)}</span>` : '<span class="daily-placeholder">-</span>'}
            ${it.category ? `<span>${escapeHtml(it.category)}</span>` : '<span>구분 없음</span>'}
            <span class="daily-status ${statusKey}">${boardStatusLabel(statusKey)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderUndatedCards() {
    return renderImportantCardList(importantUndatedTasks(), '미지정 항목이 없어요.');
  }

  function renderDateImportantCards(dateStr) {
    return renderImportantCardList(importantTasksForDate(dateStr), '이 날짜의 중요 업무가 없어요.');
  }

  function renderRoutineCards() {
    if (!state || !Array.isArray(state.routines) || state.routines.length === 0) {
      return '<div class="board-routine-empty">등록된 상시 업무가 없어요.</div>';
    }
    return state.routines.map((r, i) => {
      const name = (r.name || '').trim() || '(이름 없음)';
      const slot = projectSlot(r.project) || '';
      const statusKey = boardStatusKey(r.status);
      const statusLabel = boardStatusLabel(statusKey);
      const dateText = formatDateDisplay(r.targetDate);
      const dateClass = r.targetDate ? 'routine-date-button' : 'routine-date-button unset';
      const categoryText = [r.category, r.subCategory].filter(Boolean).join(' · ');
      return `
        <div class="board-routine-card">
          <div class="board-routine-card-main">
            <input type="text"
                   class="board-routine-name-input"
                   placeholder="상시 업무명"
                   title="${escapeHtml(name)}"
                   value="${escapeHtml(r.name || '')}"
                   onchange="updateRoutineFromCalendar(${i}, 'name', this.value)">
            <div class="board-routine-card-meta">
              ${r.project ? `<span class="daily-chip" data-slot="${slot}">${escapeHtml(r.project)}</span>` : '<span class="daily-placeholder">프로젝트 없음</span>'}
              <span class="daily-status ${statusKey}">${statusLabel}</span>
              ${categoryText ? `<span>${escapeHtml(categoryText)}</span>` : ''}
            </div>
          </div>
          <div class="board-routine-card-tools">
            <div class="board-routine-card-date">
              <input type="text"
                     class="side-date date-picker-input ${dateClass}"
                     placeholder="미지정 📅"
                     value="${escapeHtml(dateText)}"
                     readonly
                     onclick="this.focus()"
                     onchange="onSideDateChange('routine', ${i}, this.value)">
            </div>
            <button type="button" class="board-routine-delete" title="상시 업무 삭제" onclick="event.stopPropagation(); deleteRoutineFromCalendar(${i})">×</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function boardDateTitle(dateStr) {
    const date = boardDateObj(dateStr);
    if (!date) return dateStr || '';
    return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 ${BOARD_WEEKDAY_LABELS[date.getDay()]}`;
  }

  window.openBoardUndatedPopover = function(anchorEl) {
    closeBoardPopover(true);
    if (!anchorEl) return;
    const pop = document.createElement('div');
    pop.className = 'daily-popover board-undated-popover';
    pop.innerHTML = `
      <div class="board-editor-head">
        <span>날짜 미지정</span>
        <button type="button" class="board-editor-close" onclick="closeBoardPopover()" aria-label="닫기">✕</button>
      </div>
      <div class="board-undated-list" ondragover="onBoardUndatedDragOver(event)" ondrop="onBoardUndatedDrop(event)">${renderUndatedCards()}</div>
    `;
    document.body.appendChild(pop);
    positionPopoverBelow(anchorEl, pop, { centered: true });
    boardOpenPopover = { type: 'undated', el: pop };
    attachBoardPopoverGlobalListeners();
  };

  function refreshBoardRoutinesPopover() {
    if (!boardOpenPopover || boardOpenPopover.type !== 'routines') return;
    const list = boardOpenPopover.el && boardOpenPopover.el.querySelector('.board-routine-list');
    if (list) list.innerHTML = renderRoutineCards();
  }

  window.openBoardRoutinesPopover = function(anchorEl) {
    closeBoardPopover(true);
    if (!anchorEl) return;
    const pop = document.createElement('div');
    pop.className = 'daily-popover board-routine-popover';
    pop.innerHTML = `
      <div class="board-editor-head">
        <span>상시 업무</span>
        <button type="button" class="board-editor-close" onclick="closeBoardPopover()" aria-label="닫기">✕</button>
      </div>
      <div class="board-routine-list">${renderRoutineCards()}</div>
      <div class="board-editor-actions">
        <span></span>
        <button type="button" class="btn primary sm" onclick="addRoutineFromCalendar()">+ 상시 업무 추가</button>
      </div>
    `;
    document.body.appendChild(pop);
    pop.addEventListener('wheel', function(e) { e.stopPropagation(); }, { passive: true });
    positionPopoverBelow(anchorEl, pop, { centered: true });
    boardOpenPopover = { type: 'routines', el: pop, keepOpenOnScroll: true };
    attachBoardPopoverGlobalListeners();
  };

  window.openBoardDateTasksPopover = function(dateStr, anchorEl) {
    closeBoardPopover(true);
    if (!anchorEl) return;
    const pop = document.createElement('div');
    pop.className = 'daily-popover board-undated-popover';
    pop.innerHTML = `
      <div class="board-editor-head">
        <span>${escapeHtml(boardDateTitle(dateStr))}</span>
        <button type="button" class="board-editor-close" onclick="closeBoardPopover()" aria-label="닫기">✕</button>
      </div>
      <div class="board-undated-list">${renderDateImportantCards(dateStr)}</div>
      <div class="board-editor-actions">
        <span></span>
        <button type="button" class="btn primary sm" onclick="addImportantTaskForDate('${dateStr}')">+ 이 날짜에 추가</button>
      </div>
    `;
    document.body.appendChild(pop);
    positionPopoverBelow(anchorEl, pop, { centered: true });
    boardOpenPopover = { type: 'date-important-list', el: pop };
    attachBoardPopoverGlobalListeners();
  };

  function openBoardDateTasksAtCell(dateStr) {
    const anchor = document.querySelector(`[data-cal-date="${dateStr}"]`);
    if (anchor) openBoardDateTasksPopover(dateStr, anchor);
  }

  window.onBoardCalMove = function(delta) {
    setBoardMonthAnchor(new Date(boardMonthAnchor.getFullYear(), boardMonthAnchor.getMonth() + delta, 1), false);
    render();
  };

  window.onBoardCalToday = function() {
    const today = new Date();
    setBoardMonthAnchor(today, true);
    boardSelectedDate = formatDate(today);
    boardTodayPulse = true;
    render();
    setTimeout(() => {
      boardTodayPulse = false;
      const cell = document.querySelector('.board-cal-day.today');
      if (cell) cell.classList.remove('pulse');
    }, 900);
  };

  function clearBoardDayClickTimer() {
    if (!boardDayClickTimer) return;
    clearTimeout(boardDayClickTimer);
    boardDayClickTimer = null;
  }

  function selectBoardCalendarDate(dateStr) {
    const date = boardDateObj(dateStr);
    if (!date) return false;
    const inCurrentMonth = boardIsSameMonth(dateStr, boardMonthAnchor);
    boardSelectedDate = dateStr;
    if (!inCurrentMonth) setBoardMonthAnchor(date, true);
    renderImportantTasks();
    return true;
  }

  window.onBoardDayClick = function(event, dateStr) {
    if (event) event.stopPropagation();
    // 팝업이 떠 있는 상태에서 다른 날짜 셀을 누르면 먼저 닫는다
    if (boardOpenPopover) closeBoardPopover();
    clearBoardDayClickTimer();
    // 모바일 원형 달력: 탭 즉시 해당 날짜의 일정 팝업(일정이 없으면 추가 팝업)
    if (document.documentElement.dataset.device === 'mobile') {
      const date = boardDateObj(dateStr);
      if (!date) return;
      boardSelectedDate = dateStr;
      if (!boardIsSameMonth(dateStr, boardMonthAnchor)) {
        setBoardMonthAnchor(date, true);
        renderImportantTasks();
      }
      if (!importantTasksForDate(dateStr).length) {
        addImportantTaskForDate(dateStr);
        return;
      }
      setTimeout(() => openBoardDateTasksAtCell(dateStr), 0);
      return;
    }
    boardDayClickTimer = setTimeout(() => {
      boardDayClickTimer = null;
      selectBoardCalendarDate(dateStr);
    }, 180);
  };

  window.onBoardDayDblClick = function(event, dateStr) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    clearBoardDayClickTimer();
    const date = boardDateObj(dateStr);
    if (!date) return;
    const inCurrentMonth = boardIsSameMonth(dateStr, boardMonthAnchor);
    boardSelectedDate = dateStr;
    if (!inCurrentMonth) {
      setBoardMonthAnchor(date, true);
      renderImportantTasks();
      setTimeout(() => {
        openBoardDateTasksAtCell(dateStr);
      }, 0);
      return;
    }
    document.querySelectorAll('.board-cal-day.selected').forEach(el => el.classList.remove('selected'));
    const anchor = event && event.currentTarget ? event.currentTarget : document.querySelector(`[data-cal-date="${dateStr}"]`);
    if (anchor) anchor.classList.add('selected');
    if (anchor) openBoardDateTasksPopover(dateStr, anchor);
  };

  window.onBoardDayKeydown = function(event, dateStr) {
    if (!event) return;
    const key = event.key;
    if (key === 'Enter' || key === ' ') {
      event.preventDefault();
      clearBoardDayClickTimer();
      selectBoardCalendarDate(dateStr);
      return;
    }
    const delta = key === 'ArrowLeft' ? -1 : key === 'ArrowRight' ? 1 : key === 'ArrowUp' ? -7 : key === 'ArrowDown' ? 7 : 0;
    if (!delta) return;
    event.preventDefault();
    const date = boardDateObj(dateStr);
    if (!date) return;
    date.setDate(date.getDate() + delta);
    const nextKey = boardDateKey(date);
    boardSelectedDate = nextKey;
    if (!boardIsSameMonth(nextKey, boardMonthAnchor)) {
      setBoardMonthAnchor(date, true);
      render();
      setTimeout(() => {
        const nextCell = document.querySelector(`[data-cal-date="${nextKey}"]`);
        if (nextCell) nextCell.focus();
      }, 0);
      return;
    }
    renderImportantTasks();
    const nextCell = document.querySelector(`[data-cal-date="${nextKey}"]`);
    if (nextCell) nextCell.focus();
  };

  let boardDraggedImportantIdx = -1;
  window.onImportantDragStart = function(event, idx) {
    boardDraggedImportantIdx = idx;
    if (event && event.dataTransfer) {
      event.dataTransfer.effectAllowed = 'move';
      try { event.dataTransfer.setData('text/plain', String(idx)); } catch (e) {}
    }
  };
  window.onImportantDragEnd = function() {
    boardDraggedImportantIdx = -1;
    document.querySelectorAll('.board-cal-day.drag-over').forEach(el => el.classList.remove('drag-over'));
  };
  window.onBoardDayDragOver = function(event) {
    if (boardDraggedImportantIdx < 0) return;
    event.preventDefault();
    const cell = event.currentTarget;
    if (cell) cell.classList.add('drag-over');
  };
  window.onBoardDayDragLeave = function(event) {
    const cell = event.currentTarget;
    if (cell) cell.classList.remove('drag-over');
  };
  window.onBoardDayDrop = function(event, dateStr) {
    event.preventDefault();
    const cell = event.currentTarget;
    if (cell) cell.classList.remove('drag-over');
    if (boardDraggedImportantIdx < 0 || !state.importantTasks[boardDraggedImportantIdx]) return;
    state.importantTasks[boardDraggedImportantIdx].targetDate = dateStr;
    boardSelectedDate = dateStr;
    saveState();
    render();
    boardDraggedImportantIdx = -1;
  };
  window.onBoardUndatedDrop = function(event) {
    event.preventDefault();
    if (boardDraggedImportantIdx < 0 || !state.importantTasks[boardDraggedImportantIdx]) return;
    state.importantTasks[boardDraggedImportantIdx].targetDate = '';
    saveState();
    render();
    boardDraggedImportantIdx = -1;
  };
  window.onBoardUndatedDragOver = function(event) {
    if (boardDraggedImportantIdx < 0) return;
    event.preventDefault();
  };

  window.updateImportantDraft = function(idx, field, value) {
    if (!state.importantTasks[idx]) return;
    state.importantTasks[idx][field] = value;
  };

  window.onImportantEditorDateChange = function(idx, text) {
    if (!state.importantTasks[idx]) return;
    const parsed = parseDateInput(text, boardMonthAnchor.getFullYear());
    state.importantTasks[idx].targetDate = parsed && parsed !== DASH ? parsed : '';
    if (state.importantTasks[idx].targetDate) {
      boardSelectedDate = state.importantTasks[idx].targetDate;
      const nextDate = boardDateObj(state.importantTasks[idx].targetDate);
      if (nextDate) setBoardMonthAnchor(nextDate, true);
    }
  };

  window.deleteImportantFromEditor = function(idx) {
    const item = state.importantTasks[idx];
    if (!item) return;
    const name = boardTaskLabel(item);
    showModal('중요 업무 삭제', `"${name}" 항목을 삭제할까요?`, () => {
      if (boardOpenPopover && boardOpenPopover.type === 'important-editor') boardOpenPopover.onClose = null;
      state.importantTasks.splice(idx, 1);
      closeBoardPopover();
      saveState();
      render();
    });
  };

  window.openImportantEditor = function(idx, anchorEl) {
    closeBoardPopover(true);
    const item = state.importantTasks[idx];
    if (!item || !anchorEl) return;
    const pop = document.createElement('div');
    pop.className = 'daily-popover board-task-popover';
    const current = state.importantTasks[idx];
    pop.innerHTML = `
      <div class="board-editor-head">
        <span>중요 업무 편집</span>
        <button type="button" class="board-editor-close" onclick="closeBoardPopover()" aria-label="닫기">✕</button>
      </div>
      <div class="board-editor-stack">
        <label class="board-editor-field">
          <span>업무명</span>
          <input type="text" value="${escapeHtml(boardTaskLabel(current) === '(이름 없음)' ? '' : current.name || '')}" oninput="updateImportantDraft(${idx}, 'name', this.value)">
        </label>
        <div class="board-editor-grid">
          <label class="board-editor-field">
            <span>프로젝트</span>
            <select onchange="updateImportantDraft(${idx}, 'project', this.value)">${importantTaskOptionsHtml(current.project || '')}</select>
          </label>
          <label class="board-editor-field">
            <span>상태</span>
            <select onchange="updateImportantDraft(${idx}, 'status', this.value)">
              <option value="대기"${current.status === '대기' ? ' selected' : ''}>대기</option>
              <option value="진행중"${current.status === '진행중' ? ' selected' : ''}>진행중</option>
              <option value="완료"${current.status === '완료' ? ' selected' : ''}>완료</option>
            </select>
          </label>
          <label class="board-editor-field">
            <span>마감일</span>
            <input type="text" class="date-picker-input" value="${escapeHtml(formatDateDisplay(current.targetDate || ''))}" placeholder="4/13" onchange="onImportantEditorDateChange(${idx}, this.value)">
          </label>
          <label class="board-editor-field">
            <span>구분</span>
            <input type="text" value="${escapeHtml(current.category || '')}" placeholder="구분" oninput="updateImportantDraft(${idx}, 'category', this.value)">
          </label>
        </div>
        <label class="board-editor-field">
          <span>메모</span>
          <textarea class="board-editor-note" oninput="updateImportantDraft(${idx}, 'note', this.value)">${escapeHtml(current.note || '')}</textarea>
        </label>
        <div class="board-editor-actions">
          <button type="button" class="btn sm board-editor-delete" onclick="deleteImportantFromEditor(${idx})">삭제</button>
          <button type="button" class="btn primary sm" onclick="closeBoardPopover()">저장</button>
        </div>
      </div>
    `;
    document.body.appendChild(pop);
    positionPopoverBelow(anchorEl, pop, { centered: true });
    boardOpenPopover = {
      type: 'important-editor',
      idx: idx,
      el: pop,
      onClose: function() {
        saveState();
        render();
      }
    };
    attachBoardPopoverGlobalListeners();
  };

  // 모바일 원형 달력 — 프로젝트 슬롯별 대표 색 (칩/카드 색상과 동일 계열의 진한 톤)
  const ORB_SLOT_COLORS = { p1: '#d06a6a', p2: '#7a6ad0', p3: '#9a9a97' };
  const ORB_DEFAULT_COLOR = '#4b8bd4';

  function orbColorsForItems(items) {
    const colors = [];
    for (const it of items) {
      const c = ORB_SLOT_COLORS[projectSlot(it.project)] || ORB_DEFAULT_COLOR;
      if (!colors.includes(c)) colors.push(c);
      if (colors.length >= 2) break;
    }
    return colors;
  }

  function orbHtml(items) {
    if (!items.length) return '<div class="board-cal-orb empty" aria-hidden="true"></div>';
    const colors = orbColorsForItems(items);
    const bg = colors.length === 1
      ? colors[0]
      : `linear-gradient(135deg, ${colors[0]} 0%, ${colors[0]} 50%, ${colors[1]} 50%, ${colors[1]} 100%)`;
    return `<div class="board-cal-orb" style="background:${bg}" aria-hidden="true">${items.length}</div>`;
  }

  function renderImportantTasks() {
    const list = document.getElementById('importantList');
    if (!list) return;
    list.className = 'board-important-panel';
    ensureBoardSelectedDate();
    const counter = document.getElementById('importantCount');
    if (counter) counter.textContent = state.importantTasks.length;

    const monthTitle = `${boardMonthAnchor.getFullYear()}년 ${boardMonthAnchor.getMonth() + 1}월`;
    const first = new Date(boardMonthAnchor.getFullYear(), boardMonthAnchor.getMonth(), 1);
    const offset = first.getDay();
    const lastDate = new Date(boardMonthAnchor.getFullYear(), boardMonthAnchor.getMonth() + 1, 0).getDate();
    const start = new Date(boardMonthAnchor.getFullYear(), boardMonthAnchor.getMonth(), 1 - offset);
    const todayKey = formatDate(new Date());
    const dayCells = [];
    const visibleWeeks = Math.ceil((offset + lastDate) / 7);
    const totalCells = Math.max(35, visibleWeeks * 7);
    for (let i = 0; i < totalCells; i++) {
      const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const key = boardDateKey(date);
      const inMonth = date.getMonth() === boardMonthAnchor.getMonth();
      const items = importantTasksForDate(key);
      const classes = [
        'board-cal-day',
        inMonth ? '' : 'muted',
        key === todayKey ? 'today' : '',
        key === boardSelectedDate ? 'selected' : '',
        date.getDay() === 0 ? 'sun' : '',
        boardTodayPulse && key === todayKey ? 'pulse' : ''
      ].filter(Boolean).join(' ');
      const chips = items.slice(0, 1).map(it => {
        const idx = state.importantTasks.indexOf(it);
        return `<button type="button"
                  class="board-cal-chip ${it.status === '완료' ? 'done' : ''}"
                  data-slot="${projectSlot(it.project) || ''}"
                  data-imp-anchor="${idx}"
                  draggable="true"
                  ondragstart="onImportantDragStart(event, ${idx})"
                  ondragend="onImportantDragEnd(event)"
                  ondblclick="event.stopPropagation()"
                  onclick="event.stopPropagation(); openImportantEditor(${idx}, this)"
                  title="${escapeHtml(boardTaskLabel(it))}">${escapeHtml(boardTaskLabel(it))}</button>`;
      }).join('');
      const more = items.length > 1 ? `<div class="board-cal-more">+${items.length - 1}</div>` : '';
      dayCells.push(`
        <div class="${classes}"
             data-cal-date="${key}"
             tabindex="0"
             onclick="onBoardDayClick(event, '${key}')"
             ondblclick="onBoardDayDblClick(event, '${key}')"
             onkeydown="onBoardDayKeydown(event, '${key}')"
             ondragover="onBoardDayDragOver(event)"
             ondragleave="onBoardDayDragLeave(event)"
             ondrop="onBoardDayDrop(event, '${key}')">
          <div class="board-cal-date">${date.getDate()}</div>
          ${orbHtml(items)}
          <button type="button"
                  class="board-cal-add"
                  onclick="event.stopPropagation(); addImportantTaskForDate('${key}')"
                  ondblclick="event.stopPropagation()"
                  title="이 날짜에 중요 업무 추가"
                  aria-label="${key} 중요 업무 추가">+</button>
          ${chips}
          ${more}
        </div>
      `);
    }

    const undatedItems = importantUndatedTasks();

    list.innerHTML = `
      <div class="board-cal-toolbar">
        <div class="board-cal-title-block">
          <div class="board-cal-title">${monthTitle}</div>
        </div>
        <div class="board-cal-nav">
          <button type="button" class="board-cal-nav-btn" onclick="onBoardCalMove(-1)">◀</button>
          <button type="button" class="board-cal-nav-btn" onclick="onBoardCalToday()">오늘</button>
          <button type="button" class="board-cal-nav-btn" onclick="onBoardCalMove(1)">▶</button>
          <button type="button" class="board-cal-nav-btn" onclick="openBoardUndatedPopover(this)">미지정 ${undatedItems.length}</button>
          <button type="button" class="board-cal-nav-btn" onclick="openBoardRoutinesPopover(this)">상시 ${state.routines.length}</button>
        </div>
      </div>
      <div class="board-cal-shell">

  function setupRowDnD(list, kind) {
    let dragFrom = -1;
    let lastTarget = null;
    let hoverRow = null;
    let insertAfter = false;
    const setHoverRow = row => {
      if (hoverRow === row) return;
      list.querySelectorAll('.st-row-hover').forEach(el => el.classList.remove('st-row-hover'));
      hoverRow = row;
      if (row !== null && row !== undefined) {
        list.querySelectorAll(`[data-row="${row}"]`).forEach(el => el.classList.add('st-row-hover'));
      }
    };
    const clearMarks = () => {
      list.querySelectorAll('.st-row-drop-before, .st-row-drop-after, .st-row-dragging').forEach(el => {
        el.classList.remove('st-row-drop-before', 'st-row-drop-after', 'st-row-dragging');
      });
      lastTarget = null;
    };
    list.addEventListener('mouseover', function(e) {
      const cell = e.target.closest('[data-row]');
      if (!cell || !list.contains(cell)) return;
      setHoverRow(cell.dataset.row);
    });
    list.addEventListener('mouseleave', function() {
      setHoverRow(null);
    });
    list.addEventListener('dragstart', function(e) {
      const handle = e.target.closest('.st-drag');
      if (!handle) { e.preventDefault(); return; }
      dragFrom = Number(handle.dataset.row);
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', String(dragFrom)); } catch (err) {}
      }
      list.querySelectorAll(`[data-row="${dragFrom}"]`).forEach(el => el.classList.add('st-row-dragging'));
    });
    list.addEventListener('dragover', function(e) {
      if (dragFrom < 0) return;
      const cell = e.target.closest('[data-row]');
      if (!cell) return;
      const targetRow = Number(cell.dataset.row);
      if (targetRow === dragFrom) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      const rect = cell.getBoundingClientRect();
      insertAfter = (e.clientY - rect.top) > rect.height / 2;
      if (lastTarget !== targetRow) {
        list.querySelectorAll('.st-row-drop-before, .st-row-drop-after').forEach(el => {
          el.classList.remove('st-row-drop-before', 'st-row-drop-after');
        });
        list.querySelectorAll(`[data-row="${targetRow}"]`).forEach(el => {
          el.classList.add(insertAfter ? 'st-row-drop-after' : 'st-row-drop-before');
        });
        lastTarget = targetRow;
      }
    });
    list.addEventListener('dragleave', function(e) {
      if (!list.contains(e.relatedTarget)) clearMarks();
    });
    list.addEventListener('drop', function(e) {
      e.preventDefault();
      if (dragFrom < 0 || lastTarget === null) { clearMarks(); dragFrom = -1; return; }
      const arr = kind === 'important' ? state.importantTasks : state.routines;
      const from = dragFrom;
      let to = lastTarget + (insertAfter ? 1 : 0);
      if (from < to) to -= 1;
      if (from !== to && from >= 0 && from < arr.length && to >= 0 && to < arr.length) {
        const moved = arr.splice(from, 1)[0];
        arr.splice(to, 0, moved);
        saveState();
        render();
      } else {
        clearMarks();
      }
      dragFrom = -1;
    });
    list.addEventListener('dragend', function() {
      clearMarks();
      dragFrom = -1;
    });
  }

  function ensureDatePickerEl() {
    if (datePicker.el) return datePicker.el;
    const el = document.createElement('div');
    el.className = 'date-picker hidden';
    el.innerHTML = [
      '<div class="dp-header">',
      '  <button class="dp-nav" data-dir="-1" title="이전 달">◀</button>',
      '  <span class="dp-title"></span>',
      '  <button class="dp-nav" data-dir="1" title="다음 달">▶</button>',
      '</div>',
      '<div class="dp-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>',
      '<div class="dp-grid"></div>',
      '<div class="dp-actions">',
      '  <button class="dp-action dp-today-btn" data-act="today">오늘</button>',
      '  <button class="dp-action dp-unset-btn" data-act="unset">미설정 -</button>',
      '  <button class="dp-action dp-clear-btn" data-act="clear">지우기</button>',
      '</div>'
    ].join('');
    document.body.appendChild(el);

    el.addEventListener('mousedown', e => e.preventDefault());
    el.querySelectorAll('.dp-nav').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!datePicker.currentMonth) return;
        const dir = parseInt(btn.dataset.dir, 10);
        datePicker.currentMonth.setMonth(datePicker.currentMonth.getMonth() + dir);
        renderDatePickerGrid();
      });
    });
    el.querySelector('.dp-grid').addEventListener('click', e => {
      const cell = e.target.closest('.dp-cell');
      if (!cell || cell.classList.contains('dp-empty')) return;
      const date = cell.dataset.date;
      if (date) commitDatePick(date);
    });
    el.querySelectorAll('.dp-action').forEach(btn => {
      btn.addEventListener('click', () => {
        const act = btn.dataset.act;
        if (act === 'today') commitDatePick(formatDate(new Date()));
        else if (act === 'unset') commitDatePick(DASH);
        else if (act === 'clear') commitDatePick('');
      });
    });

    datePicker.el = el;
    return el;
  }

  function openDatePickerFor(input) {
    ensureDatePickerEl();
    datePicker.currentInput = input;
    const year = new Date().getFullYear();
    const parsed = parseDateInput(input.value || '', year);
    let base;
    if (parsed && parsed !== DASH) {
      base = new Date(parsed);
      if (isNaN(base.getTime())) base = new Date();
    } else {
      base = new Date();
    }
    datePicker.currentMonth = new Date(base.getFullYear(), base.getMonth(), 1);
    positionDatePicker(input);
    renderDatePickerGrid();
    datePicker.el.classList.remove('hidden');
  }

  function closeDatePicker() {
    if (datePicker.el) datePicker.el.classList.add('hidden');
    datePicker.currentInput = null;
    datePicker.currentMonth = null;
  }

  function commitDatePick(dateStr) {
    const input = datePicker.currentInput;
    if (input) {
      let displayValue;
      if (dateStr === DASH) displayValue = DASH;
      else if (!dateStr) displayValue = '';
      else displayValue = formatDateDisplay(dateStr);
      input.value = displayValue;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }
    closeDatePicker();
  }

  function positionDatePicker(input) {
    const rect = input.getBoundingClientRect();
    const el = datePicker.el;
    const width = 268;
    const height = 290;
    let left = rect.left;
    if (left + width > window.innerWidth - 8) left = window.innerWidth - width - 8;
    if (left < 8) left = 8;
    let top = rect.bottom + 4;
    if (top + height > window.innerHeight - 8) top = rect.top - height - 4;
    if (top < 8) top = 8;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }

  function renderDatePickerGrid() {
    const el = datePicker.el;
    if (!el || !datePicker.currentMonth) return;
    const month = datePicker.currentMonth;
    const year = month.getFullYear();
    const monthIndex = month.getMonth();

    el.querySelector('.dp-title').textContent = `${year}년 ${monthIndex + 1}월`;

    const firstDow = new Date(year, monthIndex, 1).getDay();
    const lastDate = new Date(year, monthIndex + 1, 0).getDate();
    const today = formatDate(new Date());
    const input = datePicker.currentInput;
    const selectedYmd = input ? parseDateInput(input.value || '', year) : '';

    const cells = [];
    for (let i = 0; i < firstDow; i++) {
      cells.push('<span class="dp-cell dp-empty"></span>');
    }
    for (let day = 1; day <= lastDate; day++) {
      const dateStr = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dow = new Date(year, monthIndex, day).getDay();
      const classes = ['dp-cell'];
      if (dateStr === today) classes.push('dp-today');
      if (dateStr === selectedYmd) classes.push('dp-selected');
      if (dow === 0) classes.push('dp-sun');
      if (dow === 6) classes.push('dp-sat');
      cells.push(`<button type="button" class="${classes.join(' ')}" data-date="${dateStr}">${day}</button>`);
    }
    el.querySelector('.dp-grid').innerHTML = cells.join('');
  }

  function initDatePicker() {

        openDatePickerFor(input);
        return;

      if (datePicker.el && datePicker.el.contains(e.target)) return;
      if (datePicker.el && !datePicker.el.classList.contains('hidden')) closeDatePicker();
    });
    document.addEventListener('mousedown', e => {
      if (!datePicker.el || datePicker.el.classList.contains('hidden')) return;
      if (datePicker.el.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.date-picker-input')) return;
      closeDatePicker();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && datePicker.el && !datePicker.el.classList.contains('hidden')) closeDatePicker();
    });
    window.addEventListener('scroll', () => {
      if (datePicker.el && !datePicker.el.classList.contains('hidden')) closeDatePicker();
    }, true);

  function todayDailyIdx() {
    const dow = new Date().getDay(); // Sun=0..Sat=6
    const monIdx = (dow + 6) % 7;    // Mon=0..Sun=6
    return monIdx < 5 ? monIdx : -1;
  }

  function sendImportantToToday(i) {
    const it = state.importantTasks && state.importantTasks[i];
    if (!it) return;
    const name = (it.name || '').trim();
    if (!name) { showModal('이동 불가', '업무명이 비어 있어요. 먼저 이름을 입력해주세요.', null); return; }
    const task = {
      project: it.project || '',
      name: name,
      note: it.category ? `[${it.category}]` : '',
      targetDate: it.targetDate || '',
      startTime: '', endTime: '',
      estimatedHours: '', adjustHours: 0,
      done: false
    };
    const tIdx = todayDailyIdx();
    if (tIdx === -1) {
      if (!Array.isArray(state.carryover)) state.carryover = [];
      state.carryover.push({ qKey: 'q1', task });
      saveState();
      showModal('이동 예약됨', `"${name}" 은(는) 다음 주 월요일 오늘 카드에 추가됩니다.`, null);
      return;
    }
    const day = state.days[tIdx];
    if (!day.quadrants) day.quadrants = { q1: [], q2: [], q3: [], q4: [] };
    if (!Array.isArray(day.quadrants.q1)) day.quadrants.q1 = [];
    day.quadrants.q1.push(task);
    saveState();
    const ch = (typeof getBroadcastChannel === 'function') ? getBroadcastChannel() : null;
    if (ch) { try { ch.postMessage({ type: 'worklog:task-sent-to-today', name }); } catch (e) {} }
    showModal('오늘 카드로 이동', `"${name}" 을(를) 오늘의 Q1(중요·긴급)에 추가했어요.`, null);
  }

    'rt-proj': 48, 'rt-cat': 52, 'rt-detail': 56, 'rt-status': 62, 'rt-date': 84, 'rt-dday': 60, 'rt-del': 40
  };
  // name은 기본값 없음(1fr). 드래그 시 고정 폭으로 전환, 더블클릭으로 다시 1fr 복원.
  const B_FLEX_COLS = new Set(['imp-name', 'rt-name']);
  const B_ROUTINE_COLS = ['rt-proj', 'rt-cat', 'rt-detail', 'rt-name', 'rt-status', 'rt-date', 'rt-dday', 'rt-del'];
  const B_ROUTINE_NAME_DEFAULT = 170;
  const B_ROUTINE_DRAG_COL = 22;
  const B_ROUTINE_GRID_GAPS = 8;
  const B_ROUTINE_PANEL_EXTRA = 34;
  const B_COL_MIN = 36;
  const B_COL_MAX = 600;
  const B_COL_STORAGE_KEY = 'worklog-board-col-widths';
  const B_LAYOUT_STORAGE_KEY = 'worklog-board-layout-widths';
  const B_CALENDAR_PANEL_MIN = 320;
  const B_GRID_RESIZER_W = 10;
  const B_GRID_GAPS = 20;
  let boardCalendarPanelManualWidth = loadBoardLayoutWidth();

  function applyBCol(key, w) {
    document.documentElement.style.setProperty(`--b-${key}`, w + 'px');
    if (isRoutineBCol(key)) syncRoutinePanelWidth();
  }
  function isKnownBCol(key) {
    return !!key && (key in B_COL_DEFAULTS || B_FLEX_COLS.has(key));
  }
  function clearBCol(key) {
    document.documentElement.style.removeProperty(`--b-${key}`);
    if (isRoutineBCol(key)) syncRoutinePanelWidth();
  }
  function isRoutineBCol(key) {
    return B_ROUTINE_COLS.includes(key);
  }
  function routineBColWidth(key) {
    const inline = document.documentElement.style.getPropertyValue(`--b-${key}`).trim();
    const inlinePx = parseInt(inline, 10);
    if (inlinePx) return inlinePx;
    if (key in B_COL_DEFAULTS) return B_COL_DEFAULTS[key];
    return B_ROUTINE_NAME_DEFAULT;
  }
  function loadBoardLayoutWidth() {
    try {
      const raw = localStorage.getItem(B_LAYOUT_STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      const width = Number(parsed && parsed.calendarPanelWidth);
      return width > 0 ? width : null;
    } catch (e) {
      return null;
    }
  }
  function saveBoardLayoutWidth() {
    try {
      if (!boardCalendarPanelManualWidth) {
        localStorage.removeItem(B_LAYOUT_STORAGE_KEY);
        return;
      }
      localStorage.setItem(B_LAYOUT_STORAGE_KEY, JSON.stringify({ calendarPanelWidth: boardCalendarPanelManualWidth }));
    } catch (e) {}
  }
  function routinePanelWidth() {
    const raw = getComputedStyle(document.documentElement).getPropertyValue('--board-routine-panel-w').trim();
    const px = parseInt(raw, 10);
    return px || 636;
  }
  function boardGridAvailableWidth() {
    const grid = document.getElementById('boardGrid');
    const parent = grid && grid.parentElement;
    const rect = parent ? parent.getBoundingClientRect() : null;
    const fallback = 1800;
    if (!rect) return fallback;
    const appWidth = Math.max(rect.width, window.innerWidth - 28);
    return Math.min(appWidth, 1800);
  }
  function calendarPanelBounds() {
    const max = Math.max(B_CALENDAR_PANEL_MIN, Math.floor(boardGridAvailableWidth() - routinePanelWidth() - B_GRID_RESIZER_W - B_GRID_GAPS));
    return { min: B_CALENDAR_PANEL_MIN, max: max };
  }
  function clampCalendarPanelWidth(width) {
    const bounds = calendarPanelBounds();
    return Math.max(bounds.min, Math.min(bounds.max, Math.round(width)));
  }
  function syncBoardGridWidth() {
    if (!boardCalendarPanelManualWidth) {
      document.documentElement.style.removeProperty('--board-calendar-panel-w');
      document.documentElement.style.removeProperty('--board-grid-w');
      return;
    }
    boardCalendarPanelManualWidth = clampCalendarPanelWidth(boardCalendarPanelManualWidth);
    const gridW = boardCalendarPanelManualWidth + routinePanelWidth() + B_GRID_RESIZER_W + B_GRID_GAPS;
    document.documentElement.style.setProperty('--board-calendar-panel-w', boardCalendarPanelManualWidth + 'px');
    document.documentElement.style.setProperty('--board-grid-w', gridW + 'px');
  }
  function syncRoutinePanelWidth() {
    const colTotal = B_ROUTINE_DRAG_COL + B_ROUTINE_GRID_GAPS + B_ROUTINE_COLS.reduce((sum, key) => sum + routineBColWidth(key), 0);
    const tableW = Math.max(360, Math.ceil(colTotal));
    const autoPanelW = tableW + B_ROUTINE_PANEL_EXTRA;
    document.documentElement.style.setProperty('--board-routine-table-w', tableW + 'px');
    document.documentElement.style.setProperty('--board-routine-panel-w', autoPanelW + 'px');
    syncBoardGridWidth();
  }
  function loadBoardColWidths() {
    try {
      const raw = localStorage.getItem(B_COL_STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      Object.keys(B_COL_DEFAULTS).forEach(k => {
        const w = Number(saved[k]);
        if (w && w >= B_COL_MIN && w <= B_COL_MAX) applyBCol(k, w);
      });
      B_FLEX_COLS.forEach(k => {
        const w = Number(saved[k]);
        if (w && w >= B_COL_MIN && w <= B_COL_MAX) applyBCol(k, w);
      });
    } catch (e) {}
    syncRoutinePanelWidth();
  }
  function saveBoardColWidths() {
    try {
      const cs = getComputedStyle(document.documentElement);
      const inline = document.documentElement.style;
      const out = {};
      Object.keys(B_COL_DEFAULTS).forEach(k => {
        const raw = cs.getPropertyValue(`--b-${k}`).trim();
        out[k] = parseInt(raw, 10) || B_COL_DEFAULTS[k];
      });
      // name: 저장은 인라인 스타일이 설정돼 있을 때만 — 기본(1fr) 상태는 저장 안 함
      B_FLEX_COLS.forEach(k => {
        const raw = inline.getPropertyValue(`--b-${k}`).trim();
        const px = parseInt(raw, 10);
        if (raw && px) out[k] = px;
      });
      localStorage.setItem(B_COL_STORAGE_KEY, JSON.stringify(out));
    } catch (e) {}
  }
  function currentBColWidth(key, handle) {
    const inline = document.documentElement.style.getPropertyValue(`--b-${key}`).trim();
    const px = parseInt(inline, 10);
    if (px) return px;
    if (key in B_COL_DEFAULTS) return B_COL_DEFAULTS[key];
    // flex 컬럼(name): 현재 렌더된 헤더 셀의 실측 폭 사용
    const headCell = handle && handle.closest('.st-cell');
    return headCell ? Math.round(headCell.getBoundingClientRect().width) : 200;
  }
  function initBoardColResize() {
    let drag = null;
    document.addEventListener('mousedown', function(e) {
      const h = e.target.closest && e.target.closest('.b-col-resize');
      if (!h) return;
      const key = h.dataset.bcol;
      if (!isKnownBCol(key)) return;
      drag = { key, startX: e.clientX, startW: currentBColWidth(key, h), handle: h };
      h.classList.add('dragging');
      document.body.classList.add('resizing-col');
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!drag) return;
      const delta = e.clientX - drag.startX;
      const newW = Math.max(B_COL_MIN, Math.min(B_COL_MAX, drag.startW + delta));
      applyBCol(drag.key, newW);
    });
    document.addEventListener('mouseup', function() {
      if (!drag) return;
      drag.handle.classList.remove('dragging');
      document.body.classList.remove('resizing-col');
      drag = null;
      saveBoardColWidths();
    });
    // 더블클릭으로 기본값 복원 (name은 1fr 플렉스로 되돌림)
    document.addEventListener('dblclick', function(e) {
      const h = e.target.closest && e.target.closest('.b-col-resize');
      if (!h) return;
      const key = h.dataset.bcol;
      if (!isKnownBCol(key)) return;
      if (B_FLEX_COLS.has(key)) clearBCol(key);
      else applyBCol(key, B_COL_DEFAULTS[key]);
      saveBoardColWidths();
    });
  }

  function initBoardGridResize() {
    const handle = document.getElementById('boardGridResizer');
    if (!handle) return;
    let drag = null;
    handle.addEventListener('mousedown', function(e) {
      const important = document.querySelector('.board-important-section');
      const current = boardCalendarPanelManualWidth || (important ? important.getBoundingClientRect().width : B_CALENDAR_PANEL_MIN);
      drag = { startX: e.clientX, startW: current };
      handle.classList.add('dragging');
      document.body.classList.add('resizing-board-grid');
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!drag) return;
      const delta = e.clientX - drag.startX;
      boardCalendarPanelManualWidth = clampCalendarPanelWidth(drag.startW + delta);
      syncBoardGridWidth();
    });
    document.addEventListener('mouseup', function() {
      if (!drag) return;
      handle.classList.remove('dragging');
      document.body.classList.remove('resizing-board-grid');
      drag = null;
      saveBoardLayoutWidth();
    });
    handle.addEventListener('dblclick', function() {
      boardCalendarPanelManualWidth = null;
      saveBoardLayoutWidth();
      syncBoardGridWidth();
    });
    window.addEventListener('resize', function() {
      syncBoardGridWidth();
      if (boardCalendarPanelManualWidth) saveBoardLayoutWidth();
    });
  }

  (async function boardInit() {
    state = loadState();
    initTheme();
    initDevice();
    initModalBase();
    initHeaderCollapse();
    initDatePicker();
    subscribeStateChanges(render);
    render();
    if (typeof renderBackupReminder === 'function') renderBackupReminder('backupReminder');
    if (typeof initBoxResizer === 'function') {
      initBoxResizer({
        targetSelector: '.board-important-section',
        storageKey: 'worklog.pub.calendarBox',
        minW: 480, minH: 420,
        maxW: 1600, maxH: 1400,
        viewportPadX: 20, viewportPadY: 20
      });
    }
    if (typeof initCloudSync === 'function') {
      await initCloudSync(function(remote) {
        if (window.applyRemoteState && window.applyRemoteState(remote)) render();
      });
    }
  })();
  </script>
</body>
</html>
